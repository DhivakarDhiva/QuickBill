name: Authorship and Source Integrity Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify Authorship & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Authorship Attribution
        run: python tools/verify_authorship.py

      - name: Verify Source Integrity Manifest
        run: python tools/verify_source_integrity.py
